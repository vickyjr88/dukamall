
# Shared by the two backend/web service pairs below (the active slot and its
# rolling-deploy standby) -- mirrors drip-crm's own docker-compose.yml
# structure exactly, on a distinct port block so both stacks can run on the
# same host without colliding. See scripts/deploy.sh for how the two slots
# are swapped during a deploy.
x-web-build: &web-build
  context: ./web
  dockerfile: Dockerfile
  args:
    - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3211}
    - NEXT_PUBLIC_PLATFORM_DOMAIN=${NEXT_PUBLIC_PLATFORM_DOMAIN:-localhost:3203}

x-web-environment: &web-environment
  NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3211}
  PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-dukamall.app}
  # Extra hostnames web/app/lib/og-image.ts may fetch link-preview source
  # images from, beyond the API host itself (comma-separated). Needed when
  # media lives on another host -- e.g. api.dripemporium.store for the synced
  # msa catalogue.
  OG_IMAGE_EXTRA_HOSTS: ${OG_IMAGE_EXTRA_HOSTS:-}

# This app resolves tenants by Host header (web/middleware.ts) -- a bare
# request with no matching shop domain correctly 404s with "No shop found
# for this domain" even when Next.js itself is perfectly healthy. Sending
# PLATFORM_DOMAIN as the Host header instead proves the whole request path
# (Next.js up, reachable, and successfully resolving a real tenant) rather
# than just "some HTTP server is listening".
x-web-healthcheck: &web-healthcheck
  test: ["CMD-SHELL", "wget -qO- --header=\"Host: ${PLATFORM_DOMAIN:-dukamall.app}\" http://127.0.0.1:3202/ || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-backend-environment: &backend-environment
  DATABASE_URL: ${DATABASE_URL}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
  # Encrypts stored secrets (Paystack keys, SMTP password, admin 2FA seeds). Optional so a missing
  # value can't stop a deploy, but without it those secrets are stored unencrypted.
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
  # Set to true to serve the Swagger UI at /api-docs (off by default).
  ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
  # Two-factor sign-in for platform admins. OFF by default: with this false the feature is
  # hidden and nothing asks for a code. Turn on with true, then restart the backend.
  ADMIN_2FA_ENABLED: ${ADMIN_2FA_ENABLED:-false}
  # Only when the above is true: make every admin enrol before they can use the console.
  ADMIN_REQUIRE_2FA: ${ADMIN_REQUIRE_2FA:-false}
  PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-dukamall.app}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
  MINIO_PORT: ${MINIO_PORT:-9000}
  MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
  MINIO_BUCKET: ${MINIO_BUCKET:-shops-platform-media}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}

x-backend-healthcheck: &backend-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/health || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-backend-depends-on: &backend-depends-on
  db:
    condition: service_healthy
  minio:
    condition: service_started
  redis:
    condition: service_healthy

services:
  # Two slots per app, "web"/"web2" and "backend"/"backend2", exactly like
  # drip-crm -- see scripts/deploy.sh for the swap mechanics.
  web:
    build: *web-build
    ports:
      - "${WEB_PORT:-3203}:3202"
    environment:
      <<: *web-environment
      # Each web slot talks to its own paired backend by real service name,
      # not a shared alias -- during a rolling deploy both backend and
      # backend2 are briefly up together, and a floating alias would let
      # Docker's round-robin DNS route a request to whichever one answered,
      # including the slot mid-swap. Pairing by service name keeps each web
      # container's only network path to the API stable throughout a deploy.
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:3200}
    healthcheck: *web-healthcheck
    depends_on:
      - backend
    restart: unless-stopped

  web2:
    build: *web-build
    ports:
      - "${WEB_PORT2:-3204}:3202"
    environment:
      <<: *web-environment
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL2:-http://backend2:3200}
    healthcheck: *web-healthcheck
    depends_on:
      - backend2
    profiles: ["standby"]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3211}:3200"
    environment: *backend-environment
    healthcheck: *backend-healthcheck
    depends_on: *backend-depends-on
    restart: unless-stopped

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT2:-3212}:3200"
    environment: *backend-environment
    healthcheck: *backend-healthcheck
    depends_on: *backend-depends-on
    profiles: ["standby"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-16580}:6379"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-15533}:5432"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_HOST_PORT:-19102}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19103}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
